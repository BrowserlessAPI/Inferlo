        run: for i in $(seq 1 60); do docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 && exit 0; sleep 2; done; docker logs kafka; exit 1
