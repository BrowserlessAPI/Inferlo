name: CI

# Version policy (see AGENTS.md "Supported versions"): every runtime, database and language
# Inferlo supports is tested at its oldest supported version and its latest version.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so a new upstream release (Node, Bun, PostgreSQL, TypeScript) is tested
    # even when nothing in Inferlo changed.
    - cron: "17 3 * * 1"

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 22.18 = oldest supported (package.json engines), 22 = oldest LTS line (end of life 2027-04-30),
        # 24 = maintenance LTS, 26 = newest LTS (active since 2026-10-28), current = newest Node release.
        node: ["22.18", "22", "24", "26", "current"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-llms.ts --check
      - run: node bench/run.ts --verify
      - run: node bench/run.ts --baseline

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every supported major version: 14 is the oldest still supported upstream
        # (end of life 2026-11-12, then 15 becomes the oldest), latest = newest release.
        postgres: ["14", "15", "16", "17", "18", "latest"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - name: Server version
        run: node -e "const {Client}=require('pg');const c=new Client({connectionString:process.env.INFERLO_TEST_DATABASE_URL});c.connect().then(()=>c.query('show server_version')).then(r=>{console.log('PostgreSQL',r.rows[0].server_version);return c.end()})"
      - run: npm test

  mysql:
    name: MySQL ${{ matrix.mysql }} with mysql2 ${{ matrix.mysql2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 8.4 = oldest MySQL still supported upstream (the 8.4 LTS line; 8.0 ended in April 2026),
        # latest = newest release. mysql2 3.0.0 = first 3.x release (mysql2 has one release line).
        include:
          - mysql: "8.4"
            mysql2: "3.0.0"
          - mysql: "8.4"
            mysql2: "latest"
          - mysql: "latest"
            mysql2: "latest"
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inferlo_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INFERLO_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save mysql2@${{ matrix.mysql2 }}
      - name: Server and driver versions
        run: node -e "import('mysql2/promise').then(async (m)=>{const c=await m.createConnection(process.env.INFERLO_TEST_MYSQL_URL);const [r]=await c.query('select version() as v');console.log('MySQL',r[0].v);await c.end()})" && grep '"version"' node_modules/mysql2/package.json
      - run: node --test test/mysql.test.ts test/migrate-mysql.test.ts test/db.test.ts test/relations.test.ts test/paginate.test.ts test/tenant.test.ts test/audit.test.ts test/jobs-queue.test.ts test/cache.test.ts test/idempotency.test.ts test/rate-limit.test.ts

  pgvector:
    name: pgvector ${{ matrix.pgvector }} on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # 0.5.0 is the first pgvector release with HNSW indexes, which t.vector(n).index() creates.
          # pgvector has no long-term support releases; latest = its newest release tag.
          - pgvector: "v0.5.0"
            postgres: "14"
          - pgvector: "latest"
            postgres: "latest"
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
      INFERLO_TEST_PGVECTOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      # The official PostgreSQL image with pgvector built from its release tag, as pgvector's README describes.
      - name: PostgreSQL with pgvector
        run: |
          # Docker Hub sometimes answers a layer download with 502: the pull is retried before the container starts.
          for attempt in 1 2 3 4; do docker pull -q postgres:${{ matrix.postgres }} && break; echo "docker pull attempt $attempt failed"; [ "$attempt" = 4 ] && exit 1; sleep 10; done
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=inferlo_test -p 5432:5432 postgres:${{ matrix.postgres }}
          tag="${{ matrix.pgvector }}"
          if [ "$tag" = "latest" ]; then tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/pgvector/pgvector 'v*' | head -1 | sed 's#.*/##'); fi
          echo "pgvector $tag"
          docker exec pg bash -c "apt-get update -qq && apt-get install -y -qq build-essential git postgresql-server-dev-\$PG_MAJOR > /dev/null && git clone --quiet --branch $tag --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector && cd /tmp/pgvector && make -s OPTFLAGS='' && make -s install"
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres -h localhost && break; sleep 2; done
          sleep 3
          docker exec pg psql -U postgres -d inferlo_test -c "CREATE EXTENSION IF NOT EXISTS vector" -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'" -c "SHOW server_version"
      - run: node --test test/vector.test.ts

  redis:
    name: Redis ${{ matrix.redis }}, redis package ${{ matrix.client }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Redis 6.2 = oldest version still supported upstream (end of life 2027-04-01), 7.2 = oldest 7.x
        # (extended support), latest = newest release. The redis package: 5.0.0 = oldest supported client
        # (node-redis 4 gets no more releases), latest = newest release.
        redis: ["6.2", "7.2", "latest"]
        client: ["latest"]
        include:
          - redis: "6.2"
            client: "5.0.0"
          - redis: "latest"
            client: "5.0.0"
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save redis@${{ matrix.client }}
      - run: node -p "'redis package ' + require('./node_modules/redis/package.json').version"
      - name: Server version
        run: node -e "require('redis').createClient({url:process.env.INFERLO_TEST_REDIS_URL}).connect().then(async c=>{console.log((await c.info('server')).match(/redis_version:(\S+)/)[0]);await c.close()})"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/redis.test.ts test/rate-limit.test.ts test/cache.test.ts test/health.test.ts test/jobs-queue.test.ts test/events-transport.test.ts test/websocket-redis.test.ts

  ioredis:
    name: ioredis ${{ matrix.versions.ioredis }} on Redis ${{ matrix.versions.redis }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        versions:
          # ioredis 5.3.0 = oldest supported (the first release that exports Redis by name; BullMQ 5 needs 5.3.2 or
          # later, and ioredis 5 still gets releases next to 6), on Redis 6.2 (oldest version still supported
          # upstream); latest = newest ioredis on the oldest supported and the latest Redis.
          - { ioredis: "5.3.0", redis: "6.2" }
          - { ioredis: "latest", redis: "6.2" }
          - { ioredis: "latest", redis: "latest" }
    services:
      redis:
        image: redis:${{ matrix.versions.redis }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save ioredis@${{ matrix.versions.ioredis }}
      - run: node -p "'ioredis ' + require('./node_modules/ioredis/package.json').version"
      - run: npx tsc --noEmit
      - run: node --test --test-reporter=spec test/ioredis.test.ts
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - run: bun test test/ioredis.test.ts

  bullmq:
    name: BullMQ ${{ matrix.versions.bullmq }} on Redis ${{ matrix.versions.redis }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        versions:
          # BullMQ 5.0.0 = first release of BullMQ 5, the oldest major still getting releases (release-v5.x), on
          # Redis 6.2 (oldest version still supported upstream, and BullMQ's recommended minimum); latest = newest
          # BullMQ on the oldest supported and the latest Redis.
          - { bullmq: "5.0.0", redis: "6.2" }
          - { bullmq: "latest", redis: "6.2" }
          - { bullmq: "latest", redis: "latest" }
    services:
      redis:
        image: redis:${{ matrix.versions.redis }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save bullmq@${{ matrix.versions.bullmq }}
      - run: node -p "'bullmq ' + require('./node_modules/bullmq/package.json').version"
      - run: npx tsc --noEmit
      - run: node --test --test-reporter=spec test/bullmq.test.ts
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - run: bun test test/bullmq.test.ts

  performance:
    # Fails when Inferlo's throughput relative to Fastify's (same runner, same run) drops below the floors in
    # bench/perf/limits.json, so a slower change is caught whatever the speed of the runner.
    name: Performance regression check
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm run bench:perf:check

  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 5.9 = oldest supported (erasableSyntaxOnly and rewriteRelativeImportExtensions), latest = newest.
        typescript: ["5.9", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npx tsc --version
      - run: npm run typecheck
      - run: npm run build

  hono:
    name: Hono ${{ matrix.hono }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 4.0.0 = oldest supported (@browserlessapi/inferlo/hono), latest = newest release.
        hono: ["4.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save hono@${{ matrix.hono }}
      - run: node -p "'Hono ' + require('./node_modules/hono/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/hono.test.ts test/migrate-from-hono.test.ts "examples/with-hono/test/*.test.ts"

  express:
    name: Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 4 = oldest supported (Express 4 is in maintenance upstream, so its newest 4.x release is tested),
        # latest = newest release (Express 5).
        express: ["4", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save express@${{ matrix.express }}
      - run: node -p "'Express ' + require('./node_modules/express/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/express.test.ts test/migrate-from-express.test.ts test/passport.test.ts "examples/with-express/test/*.test.ts"

  fastify:
    name: Fastify ${{ matrix.fastify }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 5.0.0 = oldest supported (Fastify 4 reached end of life on 2025-06-30), latest = newest release.
        fastify: ["5.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save fastify@${{ matrix.fastify }}
      - run: node -p "'Fastify ' + require('./node_modules/fastify/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/fastify.test.ts test/migrate-from-fastify.test.ts "examples/with-fastify/test/*.test.ts"

  hapi:
    name: hapi ${{ matrix.hapi }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 21.1.0 = oldest supported (hapi 21 is the supported major, and 21.1.0 is its first release with its own
        # TypeScript types; hapi 20 no longer gets updates), latest = newest release.
        hapi: ["21.1.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save @hapi/hapi@${{ matrix.hapi }}
      - run: node -p "'hapi ' + require('./node_modules/@hapi/hapi/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/hapi.test.ts "examples/with-hapi/test/*.test.ts"

  azure:
    name: Azure Functions ${{ matrix.azure }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 4.3.0 = oldest supported (@azure/functions 4 is the supported Node.js programming model, and 4.3.0 is its
        # first release with HTTP streams), latest = newest release.
        azure: ["4.3.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save @azure/functions@${{ matrix.azure }}
      - run: node -p "'@azure/functions ' + require('./node_modules/@azure/functions/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/azure.test.ts "examples/with-azure/test/*.test.ts"

  cloudflare-workers:
    name: Cloudflare Workers (Miniflare ${{ matrix.miniflare }})
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 4.20250405.0 = oldest supported (the first Miniflare 4 release, with workerd from April 2025; Miniflare 3
        # gets no more releases), latest = newest Miniflare with the newest workerd.
        miniflare: ["4.20250405.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save miniflare@${{ matrix.miniflare }}
      - run: node -p "'miniflare ' + require('./node_modules/miniflare/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/cloudflare-workers.test.ts "examples/with-cloudflare-workers/test/*.test.ts"

  cloud-run-functions:
    name: Cloud Run functions (Functions Framework ${{ matrix.framework }})
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 4.0.0 = oldest supported (Functions Framework 3 has had no release since March 2025), latest = newest release.
        framework: ["4.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      - run: npm install --no-save @google-cloud/functions-framework@${{ matrix.framework }}
      - run: node -p "'Functions Framework ' + JSON.parse(require('fs').readFileSync('node_modules/@google-cloud/functions-framework/package.json', 'utf8')).version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/cloud-run-functions.test.ts test/node-handler.test.ts "examples/with-cloud-run-functions/test/*.test.ts"

  elysia:
    name: Elysia ${{ matrix.elysia }} on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    # Jobs take under 10 minutes; a stalled runner fails here instead of hanging for 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 1.0.0 = oldest supported (@browserlessapi/inferlo/elysia), latest = newest release.
        # Elysia runs on Bun first, so both runtimes are tested.
        elysia: ["1.0.0", "latest"]
        runtime: ["node", "bun"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: ./.github/actions/setup-bun
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      # npm ci takes about 25 seconds; an install that stalls on the registry is retried.
      - name: npm ci
        run: for attempt in 1 2 3; do timeout --kill-after=20 180 npm ci && exit 0; echo "npm ci attempt $attempt failed or stalled"; done; exit 1
      # Elysia 2 (npm's latest tag since 2.0.0-rc.4) has typebox, exact-mirror and openapi-types as peer dependencies,
      # which conflict with the Elysia 1 dependencies in the lockfile, so they are installed with it explicitly.
      - name: npm install elysia@${{ matrix.elysia }}
        run: |
          if [ "${{ matrix.elysia }}" = "latest" ] && [ "$(npm view elysia@latest version | cut -d. -f1)" != "1" ]; then
            npm install --no-save --legacy-peer-deps elysia@latest exact-mirror@latest typebox@latest openapi-types@latest
          else
            npm install --no-save elysia@${{ matrix.elysia }}
          fi
      - run: node -p "'Elysia ' + require('./node_modules/elysia/package.json').version"
      - run: npm run typecheck
      - if: matrix.runtime == 'node'
        run: node --test --test-reporter=spec test/elysia.test.ts "examples/with-elysia/test/*.test.ts"
      - if: matrix.runtime == 'bun'
        run: bun test test/elysia.test.ts examples/with-elysia/test/

