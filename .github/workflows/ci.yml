name: CI

# Version policy (see AGENTS.md "Supported versions"): every runtime, database and language
# Inferlo supports is tested at its oldest supported version and its latest version.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so a new upstream release (Node, Bun, PostgreSQL, TypeScript) is tested
    # even when nothing in Inferlo changed.
    - cron: "17 3 * * 1"

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 = oldest supported (package.json engines), 22 = oldest LTS line (end of life 2027-04-30),
        # 24 = maintenance LTS, 26 = newest LTS (active since 2026-10-28), current = newest Node release.
        node: ["22.18", "22", "24", "26", "current"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-llms.ts --check
      - run: node bench/run.ts --verify
      - run: node bench/run.ts --baseline

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported major version: 14 is the oldest still supported upstream
        # (end of life 2026-11-12, then 15 becomes the oldest), latest = newest release.
        postgres: ["14", "15", "16", "17", "18", "latest"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Server version
        run: node -e "const {Client}=require('pg');const c=new Client({connectionString:process.env.INFERLO_TEST_DATABASE_URL});c.connect().then(()=>c.query('show server_version')).then(r=>{console.log('PostgreSQL',r.rows[0].server_version);return c.end()})"
      - run: npm test

  redis:
    name: Redis ${{ matrix.redis }}, redis package ${{ matrix.client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Redis 6.2 = oldest version still supported upstream (end of life 2027-04-01), 7.2 = oldest 7.x
        # (extended support), latest = newest release. The redis package: 5.0.0 = oldest supported client
        # (node-redis 4 gets no more releases), latest = newest release.
        redis: ["6.2", "7.2", "latest"]
        client: ["latest"]
        include:
          - redis: "6.2"
            client: "5.0.0"
          - redis: "latest"
            client: "5.0.0"
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save redis@${{ matrix.client }}
      - run: node -p "'redis package ' + require('./node_modules/redis/package.json').version"
      - name: Server version
        run: node -e "require('redis').createClient({url:process.env.INFERLO_TEST_REDIS_URL}).connect().then(async c=>{console.log((await c.info('server')).match(/redis_version:(\S+)/)[0]);await c.close()})"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/redis.test.ts test/rate-limit.test.ts test/cache.test.ts test/health.test.ts test/jobs-queue.test.ts test/events-transport.test.ts

  performance:
    # Fails when Inferlo's throughput relative to Fastify's (same runner, same run) drops below the floors in
    # bench/perf/limits.json, so a slower change is caught whatever the speed of the runner.
    name: Performance regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run bench:perf:check

  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.9 = oldest supported (erasableSyntaxOnly and rewriteRelativeImportExtensions), latest = newest.
        typescript: ["5.9", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npx tsc --version
      - run: npm run typecheck
      - run: npm run build

  hono:
    name: Hono ${{ matrix.hono }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.0.0 = oldest supported (@browserlessapi/inferlo/hono), latest = newest release.
        hono: ["4.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save hono@${{ matrix.hono }}
      - run: node -p "'Hono ' + require('./node_modules/hono/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/hono.test.ts test/migrate-from-hono.test.ts "examples/with-hono/test/*.test.ts"

  express:
    name: Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4 = oldest supported (Express 4 is in maintenance upstream, so its newest 4.x release is tested),
        # latest = newest release (Express 5).
        express: ["4", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save express@${{ matrix.express }}
      - run: node -p "'Express ' + require('./node_modules/express/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/express.test.ts test/migrate-from-express.test.ts "examples/with-express/test/*.test.ts"

  fastify:
    name: Fastify ${{ matrix.fastify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.0.0 = oldest supported (Fastify 4 reached end of life on 2025-06-30), latest = newest release.
        fastify: ["5.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save fastify@${{ matrix.fastify }}
      - run: node -p "'Fastify ' + require('./node_modules/fastify/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/fastify.test.ts test/migrate-from-fastify.test.ts "examples/with-fastify/test/*.test.ts"

  hapi:
    name: hapi ${{ matrix.hapi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21.1.0 = oldest supported (hapi 21 is the supported major, and 21.1.0 is its first release with its own
        # TypeScript types; hapi 20 no longer gets updates), latest = newest release.
        hapi: ["21.1.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @hapi/hapi@${{ matrix.hapi }}
      - run: node -p "'hapi ' + require('./node_modules/@hapi/hapi/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/hapi.test.ts "examples/with-hapi/test/*.test.ts"

  azure:
    name: Azure Functions ${{ matrix.azure }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.3.0 = oldest supported (@azure/functions 4 is the supported Node.js programming model, and 4.3.0 is its
        # first release with HTTP streams), latest = newest release.
        azure: ["4.3.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @azure/functions@${{ matrix.azure }}
      - run: node -p "'@azure/functions ' + require('./node_modules/@azure/functions/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/azure.test.ts "examples/with-azure/test/*.test.ts"

  cloudflare-workers:
    name: Cloudflare Workers (Miniflare ${{ matrix.miniflare }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.20250405.0 = oldest supported (the first Miniflare 4 release, with workerd from April 2025; Miniflare 3
        # gets no more releases), latest = newest Miniflare with the newest workerd.
        miniflare: ["4.20250405.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save miniflare@${{ matrix.miniflare }}
      - run: node -p "'miniflare ' + require('./node_modules/miniflare/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/cloudflare-workers.test.ts "examples/with-cloudflare-workers/test/*.test.ts"

  cloud-run-functions:
    name: Cloud Run functions (Functions Framework ${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.0.0 = oldest supported (Functions Framework 3 has had no release since March 2025), latest = newest release.
        framework: ["4.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @google-cloud/functions-framework@${{ matrix.framework }}
      - run: node -p "'Functions Framework ' + JSON.parse(require('fs').readFileSync('node_modules/@google-cloud/functions-framework/package.json', 'utf8')).version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/cloud-run-functions.test.ts test/node-handler.test.ts "examples/with-cloud-run-functions/test/*.test.ts"

  elysia:
    name: Elysia ${{ matrix.elysia }} on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.0.0 = oldest supported (@browserlessapi/inferlo/elysia), latest = newest release.
        # Elysia runs on Bun first, so both runtimes are tested.
        elysia: ["1.0.0", "latest"]
        runtime: ["node", "bun"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - run: npm ci
      - run: npm install --no-save elysia@${{ matrix.elysia }}
      - run: node -p "'Elysia ' + require('./node_modules/elysia/package.json').version"
      - run: npm run typecheck
      - if: matrix.runtime == 'node'
        run: node --test --test-reporter=spec test/elysia.test.ts "examples/with-elysia/test/*.test.ts"
      - if: matrix.runtime == 'bun'
        run: bun test test/elysia.test.ts examples/with-elysia/test/

  nestjs:
    name: NestJS ${{ matrix.nestjs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11.0.0 = oldest supported (oldest NestJS major with security support), latest = newest release.
        nestjs: ["11.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @nestjs/common@${{ matrix.nestjs }} @nestjs/core@${{ matrix.nestjs }} @nestjs/platform-express@${{ matrix.nestjs }}
      - run: node -p "'NestJS ' + require('./node_modules/@nestjs/core/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/nestjs.test.ts test/migrate-from-nestjs.test.ts "examples/with-nestjs/test/*.test.ts"

  trpc:
    name: tRPC ${{ matrix.trpc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11.0.0 = oldest supported (tRPC 10 is no longer maintained), latest = newest release.
        trpc: ["11.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @trpc/server@${{ matrix.trpc }}
      - run: node -p "'tRPC ' + require('./node_modules/@trpc/server/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/trpc.test.ts "examples/with-trpc/test/*.test.ts"

  tsed:
    name: Ts.ED ${{ matrix.tsed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0.1 = oldest supported (8.0.0 cannot be imported as native ES modules on Node.js), latest = newest release.
        tsed: ["8.0.1", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: >-
          npm install --no-save
          @tsed/core@${{ matrix.tsed }} @tsed/di@${{ matrix.tsed }} @tsed/schema@${{ matrix.tsed }}
          @tsed/json-mapper@${{ matrix.tsed }} @tsed/openspec@${{ matrix.tsed }} @tsed/exceptions@${{ matrix.tsed }}
          @tsed/platform-http@${{ matrix.tsed }} @tsed/platform-express@${{ matrix.tsed }} @tsed/platform-params@${{ matrix.tsed }}
          @tsed/platform-views@${{ matrix.tsed }} @tsed/platform-middlewares@${{ matrix.tsed }} @tsed/platform-router@${{ matrix.tsed }}
          @tsed/platform-exceptions@${{ matrix.tsed }} @tsed/platform-response-filter@${{ matrix.tsed }}
      - run: node -p "'Ts.ED ' + require('./node_modules/@tsed/platform-express/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/tsed.test.ts "examples/with-tsed/test/*.test.ts"

  adonisjs:
    name: AdonisJS ${{ matrix.adonisjs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.2.0 = oldest supported (first stable AdonisJS 6 release, still maintained), latest = newest release (7).
        adonisjs: ["6.2.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # AdonisJS 7 needs Node.js 24.
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @adonisjs/core@${{ matrix.adonisjs }}
      - run: node -p "'AdonisJS ' + require('./node_modules/@adonisjs/core/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/adonisjs.test.ts "examples/with-adonisjs/test/*.test.ts"

  ai-sdk:
    name: AI SDK (ai ${{ matrix.ai }}, provider ${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ai 5.0.0 = oldest supported (the first release with the UI message stream protocol that useChat speaks;
        # ai 4 is no longer maintained), latest = newest release. aiSdk() providers: @ai-sdk/openai-compatible
        # 1.0.0 (LanguageModelV2, the oldest specification, made for ai 5), 2 (LanguageModelV3, ai 6) and
        # latest (LanguageModelV4, ai 7).
        include:
          - { ai: "5.0.0", provider: "1.0.0" }
          - { ai: "latest", provider: "2" }
          - { ai: "latest", provider: "latest" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save ai@${{ matrix.ai }} @ai-sdk/openai-compatible@${{ matrix.provider }}
      - run: node -p "'ai ' + require('./node_modules/ai/package.json').version + ', @ai-sdk/openai-compatible ' + require('./node_modules/@ai-sdk/openai-compatible/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/ai-sdk-ui.test.ts test/ai-sdk-provider.test.ts

  langchain:
    name: LangChain.js (@langchain/core ${{ matrix.langchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.3 = oldest supported (newest 0.3.x: LangChain 0.3 is in maintenance until December 2026),
        # latest = newest release (1.x, LangChain's long-term support line).
        langchain: ["0.3", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @langchain/core@${{ matrix.langchain }}
      - run: node -p "'@langchain/core ' + require('./node_modules/@langchain/core/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/langchain.test.ts

  koa:
    name: Koa ${{ matrix.koa }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2 = oldest supported (Koa 2 is still maintained upstream, so its newest 2.x release is tested),
        # latest = newest release (Koa 3).
        koa: ["2", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save koa@${{ matrix.koa }}
      - run: node -p "'Koa ' + require('./node_modules/koa/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/koa.test.ts test/migrate-from-koa.test.ts "examples/with-koa/test/*.test.ts"

  nextjs:
    name: Next.js ${{ matrix.next }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 15 = oldest supported (Next.js 15 is still maintained upstream with backports, so its newest 15.x is tested),
        # latest = newest release (16). The tests use Next.js's own NextRequest.
        next: ["15", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save next@${{ matrix.next }}
      - run: node -p "'Next.js ' + require('./node_modules/next/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/nextjs.test.ts "examples/with-nextjs/test/*.test.ts"

  h3:
    name: h3 ${{ matrix.h3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1 = oldest supported (h3 1 is used by Nitro 2, Nuxt 3 and Nuxt 4 and still maintained, so its newest 1.x is
        # tested), latest = newest release (h3 2, Nitro 3).
        h3: ["1", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save h3@${{ matrix.h3 }}
      - run: node -p "'h3 ' + require('./node_modules/h3/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/h3.test.ts "examples/with-nitro/test/*.test.ts"

  sveltekit:
    name: SvelteKit ${{ matrix.sveltekit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2 = oldest supported (SvelteKit 2 is the line before SvelteKit 3, so its newest 2.x is tested),
        # latest = newest release (3). SvelteKit 3 asks for TypeScript 6 as an optional peer, so it is installed with
        # --legacy-peer-deps; the tests use SvelteKit's own types and request events.
        sveltekit: ["2", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps @sveltejs/kit@${{ matrix.sveltekit }}
      - run: node -p "'SvelteKit ' + require('./node_modules/@sveltejs/kit/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/sveltekit.test.ts "examples/with-sveltekit/test/*.test.ts"

  astro:
    name: Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5 = oldest tested (its newest 5.x; endpoints, APIContext and middleware are the same in 5, 6 and 7),
        # latest = newest release. The tests render the endpoints with Astro's own container (astro/container).
        astro: ["5", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps astro@${{ matrix.astro }}
      - run: node -p "'Astro ' + require('./node_modules/astro/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/astro.test.ts "examples/with-astro/test/*.test.ts"

  react-router:
    name: React Router ${{ matrix.react_router }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7 = oldest supported (React Router 7 still gets releases, so its newest 7.x is tested),
        # latest = newest release (8). The tests run React Router's own data router (createStaticHandler).
        react_router: ["7", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save react-router@${{ matrix.react_router }}
      - run: node -p "'React Router ' + require('./node_modules/react-router/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/react-router.test.ts "examples/with-react-router/test/*.test.ts"

  opentelemetry:
    name: OpenTelemetry API ${{ matrix.otel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.3.0 = oldest supported (the oldest @opentelemetry/api the OpenTelemetry JS SDK 2.x accepts),
        # latest = newest release.
        otel: ["1.3.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @opentelemetry/api@${{ matrix.otel }}
      - run: node -p "'OpenTelemetry API ' + require('./node_modules/@opentelemetry/api/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/tracing.test.ts

  encore:
    name: Encore.ts ${{ matrix.encore }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.51.0 = oldest supported (Encore.ts has no long-term support releases; about a year of releases),
        # latest = newest release. The tests run Encore's own raw request and response classes from encore.dev.
        encore: ["1.51.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save encore.dev@${{ matrix.encore }}
      - run: node -p "'encore.dev ' + JSON.parse(require('fs').readFileSync('node_modules/encore.dev/package.json', 'utf8')).version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/node-handler.test.ts "examples/with-encore/test/*.test.ts"

  bun:
    name: Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.3.0 = oldest supported (README): older Bun releases skip or misorder node:test subtests,
        # so the suite cannot verify them. latest = newest release.
        bun: ["1.3.0", "latest"]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version
      - run: bun install
      - run: bun test test/

  deno:
    name: Deno ${{ matrix.deno }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deno supports only its newest minor release (LTS releases ended 2026-04-30): v2.9.0 = first release of the
        # supported 2.9 line (oldest tested), vx.x.x = newest release.
        deno: ["v2.9.0", "vx.x.x"]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
      INFERLO_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
      - run: deno --version
      - run: npm run test:deno
