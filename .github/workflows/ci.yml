        run: for i in $(seq 1 60); do docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1 && exit 0; sleep 2; done; docker logs rabbitmq; exit 1
      - run: docker exec rabbitmq rabbitmqctl version
      - run: npx tsc --noEmit
      - run: node --test --test-reporter=spec test/rabbitmq-events.test.ts
