      - run: node -p "'Prisma ' + require('./node_modules/prisma/package.json').version + ', @prisma/client ' + require('./node_modules/@prisma/client/package.json').version + ', @prisma/adapter-pg ' + require('./node_modules/@prisma/adapter-pg/package.json').version"
