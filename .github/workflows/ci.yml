name: CI

# Version policy (see AGENTS.md "Supported versions"): every runtime, database and language
# Inferlo supports is tested at its oldest supported version and its latest version.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so a new upstream release (Node, Bun, PostgreSQL, TypeScript) is tested
    # even when nothing in Inferlo changed.
    - cron: "17 3 * * 1"

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 = oldest supported (package.json engines), 22 = oldest LTS line (end of life 2027-04-30),
        # 24 = maintenance LTS, 26 = newest LTS (active since 2026-10-28), current = newest Node release.
        node: ["22.18", "22", "24", "26", "current"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-llms.ts --check
      - run: node bench/run.ts --verify
      - run: node bench/run.ts --baseline

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported major version: 14 is the oldest still supported upstream
        # (end of life 2026-11-12, then 15 becomes the oldest), latest = newest release.
        postgres: ["14", "15", "16", "17", "18", "latest"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Server version
        run: node -e "const {Client}=require('pg');const c=new Client({connectionString:process.env.INFERLO_TEST_DATABASE_URL});c.connect().then(()=>c.query('show server_version')).then(r=>{console.log('PostgreSQL',r.rows[0].server_version);return c.end()})"
      - run: npm test

  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.9 = oldest supported (erasableSyntaxOnly and rewriteRelativeImportExtensions), latest = newest.
        typescript: ["5.9", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npx tsc --version
      - run: npm run typecheck
      - run: npm run build

  hono:
    name: Hono ${{ matrix.hono }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.0.0 = oldest supported (@browserlessapi/inferlo/hono), latest = newest release.
        hono: ["4.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save hono@${{ matrix.hono }}
      - run: node -p "'Hono ' + require('./node_modules/hono/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/hono.test.ts "examples/with-hono/test/*.test.ts"

  express:
    name: Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4 = oldest supported (Express 4 is in maintenance upstream, so its newest 4.x release is tested),
        # latest = newest release (Express 5).
        express: ["4", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save express@${{ matrix.express }}
      - run: node -p "'Express ' + require('./node_modules/express/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/express.test.ts "examples/with-express/test/*.test.ts"

  fastify:
    name: Fastify ${{ matrix.fastify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.0.0 = oldest supported (Fastify 4 reached end of life on 2025-06-30), latest = newest release.
        fastify: ["5.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save fastify@${{ matrix.fastify }}
      - run: node -p "'Fastify ' + require('./node_modules/fastify/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/fastify.test.ts "examples/with-fastify/test/*.test.ts"

  elysia:
    name: Elysia ${{ matrix.elysia }} on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.0.0 = oldest supported (@browserlessapi/inferlo/elysia), latest = newest release.
        # Elysia runs on Bun first, so both runtimes are tested.
        elysia: ["1.0.0", "latest"]
        runtime: ["node", "bun"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - run: npm ci
      - run: npm install --no-save elysia@${{ matrix.elysia }}
      - run: node -p "'Elysia ' + require('./node_modules/elysia/package.json').version"
      - run: npm run typecheck
      - if: matrix.runtime == 'node'
        run: node --test --test-reporter=spec test/elysia.test.ts "examples/with-elysia/test/*.test.ts"
      - if: matrix.runtime == 'bun'
        run: bun test test/elysia.test.ts examples/with-elysia/test/

  nestjs:
    name: NestJS ${{ matrix.nestjs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11.0.0 = oldest supported (oldest NestJS major with security support), latest = newest release.
        nestjs: ["11.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @nestjs/common@${{ matrix.nestjs }} @nestjs/core@${{ matrix.nestjs }} @nestjs/platform-express@${{ matrix.nestjs }}
      - run: node -p "'NestJS ' + require('./node_modules/@nestjs/core/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/nestjs.test.ts "examples/with-nestjs/test/*.test.ts"

  trpc:
    name: tRPC ${{ matrix.trpc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11.0.0 = oldest supported (tRPC 10 is no longer maintained), latest = newest release.
        trpc: ["11.0.0", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save @trpc/server@${{ matrix.trpc }}
      - run: node -p "'tRPC ' + require('./node_modules/@trpc/server/package.json').version"
      - run: npm run typecheck
      - run: node --test --test-reporter=spec test/trpc.test.ts "examples/with-trpc/test/*.test.ts"

  bun:
    name: Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.3.0 = oldest supported (README): older Bun releases skip or misorder node:test subtests,
        # so the suite cannot verify them. latest = newest release.
        bun: ["1.3.0", "latest"]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inferlo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INFERLO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inferlo_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version
      - run: bun install
      - run: bun test test/
