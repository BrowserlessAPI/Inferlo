      - run: |
          for attempt in 1 2 3 4; do docker pull -q apache/kafka:${{ matrix.versions.server }} && break; echo "docker pull attempt $attempt failed"; [ "$attempt" = 4 ] && exit 1; sleep 10; done
          docker run -d --name kafka -p 9092:9092 apache/kafka:${{ matrix.versions.server }}
