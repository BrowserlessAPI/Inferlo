name: Release

# Publishes kairojs to npm when a version tag (v1.2.3) is pushed.
# Needs the repository secret NPM_TOKEN: an npm granular access token with
# read and write access to kairojs and "Bypass two-factor authentication" enabled.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KAIRO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kairo_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-llms.ts --check
      - run: node bench/run.ts --verify
      - run: node bench/run.ts --baseline
      - name: Skip if this version is already on npm
        id: exists
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "kairojs@$version" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check npm token
        if: steps.exists.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::The repository secret NPM_TOKEN is not set. Add it under Settings > Secrets and variables > Actions (name exactly NPM_TOKEN)."
            exit 1
          fi
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error title=npm rejected the token::npm whoami failed: $(echo "$who" | grep -m1 'npm error' || echo "$who" | head -1). Create a new granular token (Read and write, All packages, Bypass 2FA ticked) and update NPM_TOKEN."
            exit 1
          fi
          echo "::notice title=npm user::Publishing as $who"
      - name: Publish to npm
        if: steps.exists.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if ! npm publish --access public --provenance 2>&1 | tee publish.log; then
            msg="$(grep -E 'npm error (code|[0-9]{3}|.*(OTP|one-time|2FA|forbidden|Forbidden|permission|provenance))' publish.log | head -3 | tr '\n' ' ')"
            echo "::error title=npm publish failed::${msg:-see the Publish to npm step log}"
            exit 1
          fi
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Kairo $GITHUB_REF_NAME" --notes-file notes.md || echo "Release already exists"
