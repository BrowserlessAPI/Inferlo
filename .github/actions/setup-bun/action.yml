name: Set up Bun
description: >-
  oven-sh/setup-bun, tried twice, then the same Bun release from the bun package on npm. Bun's builds are
  downloaded from GitHub releases, which sometimes answer 502 or 504 for minutes at a time; npm serves the
  same builds, so a CI job tests the Bun version it asked for instead of failing before its first test.
inputs:
  bun-version:
    description: A Bun version such as 1.3.0, or latest.
    required: true
runs:
  using: composite
  steps:
    - id: first
      uses: oven-sh/setup-bun@v2
      continue-on-error: true
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: steps.first.outcome == 'failure'
      shell: bash
      run: sleep 20
    - id: second
      if: steps.first.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      continue-on-error: true
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        echo "GitHub release download failed twice; installing bun@${BUN_VERSION} from npm"
        for attempt in 1 2 3; do
          timeout --kill-after=20 180 npm install --global "bun@${BUN_VERSION}" && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 10
        done
        echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
    - shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        installed="$(bun --version)"
        echo "bun ${installed}"
        if [ "$BUN_VERSION" != "latest" ] && [ "$installed" != "$BUN_VERSION" ]; then
          echo "Expected Bun ${BUN_VERSION}, got ${installed}"
          exit 1
        fi
